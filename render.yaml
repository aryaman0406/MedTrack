services:
  - type: web
    name: medication-tracker
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard → Environment (paste your Supabase pooler URL)
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
