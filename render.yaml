databases:
  - name: meds-db
    databaseName: meds
    user: meds_user
    plan: free

services:
  - type: web
    name: medication-tracker
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
