{% extends "base.html" %}
{% block content %}
<div class="card p-6 md:p-8 max-w-2xl mx-auto">
  <h1 class="text-3xl font-extrabold mb-6 text-gray-900 dark:text-white flex items-center gap-2">
    <span>📷</span> OCR Prescription Upload
  </h1>

  <form method="POST" enctype="multipart/form-data" class="space-y-6">
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Choose Prescription Image</label>
      <input type="file" name="image" accept="image/*" required class="form-control">
    </div>
    <button type="submit" class="btn btn-primary w-full py-3.5">Scan Prescription</button>
  </form>

  {% if extracted_text %}
  <div class="mt-8 border-t border-border-soft pt-6">
    <h2 class="text-xl font-bold mb-4 text-gray-900 dark:text-white flex items-center gap-2">
      <span>🧾</span> Extracted Text:
    </h2>
    <div class="bg-gray-50 dark:bg-slate-800/50 border border-border-soft p-4 rounded-2xl whitespace-pre-wrap text-slate-800 dark:text-slate-200 font-medium">
      {{ extracted_text }}
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
