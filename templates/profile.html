{% extends "base.html" %}
{% block content %}
<div class="card p-6 md:p-8 max-w-2xl mx-auto">
  <h1 class="text-3xl font-extrabold mb-6 flex items-center gap-2" style="color: var(--text-main);">
    <span>👤</span> Health Profile
  </h1>
  <form method="POST" class="space-y-5">
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Name</label>
      <input name="name" placeholder="Name" value="{{ user.name }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Age</label>
      <input type="number" name="age" placeholder="Age" value="{{ user.age }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Height (cm)</label>
      <input type="number" step="0.1" name="height_cm" placeholder="Height (cm)" value="{{ user.height_cm }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Weight (kg)</label>
      <input type="number" step="0.1" name="weight_kg" placeholder="Weight (kg)" value="{{ user.weight_kg }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Blood Group</label>
      <input name="blood_group" placeholder="Blood Group" value="{{ user.blood_group }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold mb-1" style="color: var(--text-muted);">Known Conditions</label>
      <textarea name="conditions" placeholder="Known Conditions" rows="3" class="form-control">{{ user.conditions }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary w-full py-3.5">Update Profile</button>
  </form>

  {% if bmi %}
  <div class="mt-8 p-5 rounded-2xl" style="background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);">
    <h3 class="font-bold mb-2" style="color: var(--primary);">Metrics Summary:</h3>
    <p class="font-medium" style="color: var(--text-main);">
      BMI: <span class="font-bold">{{ bmi }}</span> | BMR: <span class="font-bold">{{ bmr }}</span> kcal | Hydration: <span class="font-bold">{{ hydration }}</span> L/day
    </p>
  </div>
  {% endif %}
</div>
{% endblock %}
