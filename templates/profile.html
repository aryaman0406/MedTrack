{% extends "base.html" %}
{% block content %}
<div class="card p-6 md:p-8 max-w-2xl mx-auto">
  <h1 class="text-3xl font-extrabold mb-6 text-gray-900 dark:text-white flex items-center gap-2">
    <span>👤</span> Health Profile
  </h1>
  <form method="POST" class="space-y-5">
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Name</label>
      <input name="name" placeholder="Name" value="{{ user.name }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Age</label>
      <input type="number" name="age" placeholder="Age" value="{{ user.age }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Height (cm)</label>
      <input type="number" step="0.1" name="height_cm" placeholder="Height (cm)" value="{{ user.height_cm }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Weight (kg)</label>
      <input type="number" step="0.1" name="weight_kg" placeholder="Weight (kg)" value="{{ user.weight_kg }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Blood Group</label>
      <input name="blood_group" placeholder="Blood Group" value="{{ user.blood_group }}" class="form-control">
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Known Conditions</label>
      <textarea name="conditions" placeholder="Known Conditions" rows="3" class="form-control">{{ user.conditions }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary w-full py-3.5">Update Profile</button>
  </form>

  {% if bmi %}
  <div class="mt-8 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800 p-5 rounded-2xl">
    <h3 class="font-bold text-blue-900 dark:text-blue-200 mb-2">Metrics Summary:</h3>
    <p class="text-blue-800 dark:text-blue-300 font-medium">
      BMI: <span class="font-bold">{{ bmi }}</span> | BMR: <span class="font-bold">{{ bmr }}</span> kcal | Hydration: <span class="font-bold">{{ hydration }}</span> L/day
    </p>
  </div>
  {% endif %}
</div>
{% endblock %}
